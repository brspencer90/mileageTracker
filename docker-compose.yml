# Synology Container Manager -> Project -> point at this file (or `docker compose up -d`).
# The image carries only code; data lives in the SQL Server (192.168.0.20). The
# connection string is injected at runtime from mileage-tracker.env (git-ignored,
# created on the NAS). See docs/DEPLOY_SYNOLOGY.md.
#
# NO Watchtower here on purpose: run ONE Watchtower per NAS. flightTracker already
# runs one with --label-enable, so it auto-updates this container too (via the
# enable label below; same GHCR login covers both images). Two Watchtowers fight
# and SIGTERM each other.
services:
  mileage-tracker:
    image: ghcr.io/brspencer90/mileage-tracker:latest
    container_name: mileage-tracker
    restart: unless-stopped
    ports:
      - "8124:8000"            # NAS host port : container port (see docs/PORTS.md; 8088 was taken by Omada)
    env_file:
      - mileage-tracker.env    # holds sqlss_conn_str=...  (git-ignored; created on the NAS)
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 12s
